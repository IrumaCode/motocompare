services:
  postgres:
    # Same major version as the Neon production database
    image: postgres:18-alpine
    container_name: motocompare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
